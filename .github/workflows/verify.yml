name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check out immutable documentation standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wellmanifest/docs
          ref: 6f475fb223e7a259d514b5483fb0d62f0e80a46e # v0.5.0; independently merged managed-copy support
          path: .subactor/cache/docs-standard
          token: ${{ secrets.ORG_SYNC_PAT || github.token }}
          persist-credentials: false
      - name: Check out immutable governance source for managed documentation inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wellmanifest/new-project
          ref: 2ddba8833d342b4b4201eada2d05c8b70ed4985e # v0.20.89
          path: .subactor/cache/new-project-standard
          token: ${{ secrets.ORG_SYNC_PAT || github.token }}
          persist-credentials: false
      - name: Validate documentation placement
        shell: bash
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          source = Path(".subactor/cache/new-project-standard")
          package = json.loads((source / "governance/package-manifest.json").read_text())
          inventory = {
              entry["target"]: hashlib.sha256((source / entry["source"]).read_bytes()).hexdigest()
              for entry in package["files"]
              if entry["target"].startswith(".governance/docs/")
          }
          (source / "managed-docs-inventory.json").write_text(json.dumps(inventory))
          PY
          args=(--root . --standard-revision 6f475fb223e7a259d514b5483fb0d62f0e80a46e
                --managed-copies .subactor/cache/new-project-standard/managed-docs-inventory.json)
          if [[ -n "$DOCS_BASE" ]]; then args+=(--base "$DOCS_BASE"); fi
          python .subactor/cache/docs-standard/docs/standard/check.py "${args[@]}"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate secure OpenWebUI boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/configure-openwebui-subactor.sh
          docker compose --profile openwebui config -q
          docker compose --profile openwebui config --format json | jq -e '
            .services["mcp-gateway"].ports == [{
              "mode": "ingress",
              "host_ip": "127.0.0.1",
              "target": 9000,
              "published": "9000",
              "protocol": "tcp"
            }] and
            .services.openwebui.ports == [{
              "mode": "ingress",
              "host_ip": "127.0.0.1",
              "target": 8080,
              "published": "3000",
              "protocol": "tcp"
            }] and
            .services.openwebui.environment.WEBUI_AUTH == "True" and
            .services.openwebui.environment.ENABLE_SIGNUP == "False" and
            .services.openwebui.image == "ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228" and
            any(
              .services.openwebui.volumes[];
              .target == "/run/secrets/openwebui-mcp-bearer" and
              .read_only == true
            )
          '
